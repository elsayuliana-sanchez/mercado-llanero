spring.application.name=mercadito-llanero

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mercadito_llanero}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Demostración académica. El código aparece en la consola local del servidor.
mercadito.recuperacion.simulada=true
